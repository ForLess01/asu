name: Application and model checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: vars.ASU_HOSTED_JOBS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: python -m pip install -r ml/requirements.txt
      - run: npm run typecheck
      - run: npm test
      - run: python -m pytest -q -p no:cacheprovider ml/tests supabase/tests/test_schema.py neon/tests scripts/tests
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Preserve browser failure traces only
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-failure-${{ github.run_id }}
          path: /tmp/asu-playwright-results
          retention-days: 7
          if-no-files-found: ignore
  database:
    if: vars.ASU_HOSTED_JOBS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: local-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Execute both provider contracts in separate disposable databases
        env:
          PGPASSWORD: local-test-only
        run: |
          createdb -h 127.0.0.1 -U postgres asu_legacy
          createdb -h 127.0.0.1 -U postgres asu_neon
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d asu_legacy -f supabase/tests/auth_fixture.sql
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d asu_legacy -f supabase/migrations/20261020000100_household_workspaces.sql
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d asu_legacy -f supabase/tests/workspace_isolation.sql
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d asu_neon -f neon/tests/auth_fixture.sql
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d asu_neon -f neon/migrations/20261020000100_household_workspaces.sql
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d asu_neon -f neon/tests/workspace_isolation.sql
