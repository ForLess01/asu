name: Source maintenance
on:
  schedule:
    - cron: '23 11 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: data-maintenance
  cancel-in-progress: false
jobs:
  check:
    if: vars.ASU_HOSTED_JOBS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r ml/requirements.txt
      - name: Validate changed source and train only changed approved fingerprints
        run: python ml/update_data.py --retrain --timeout-seconds 300 > maintenance-result.json
      - name: Preserve maintenance evidence without promoting a model
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: maintenance-${{ github.run_id }}
          path: |
            maintenance-result.json
            data/manifests/update-state.json
          retention-days: 7
          if-no-files-found: error
