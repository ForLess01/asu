name: Publish experimental application
on:
  workflow_run:
    workflows: [Application and model checks]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm_experimental:
        type: boolean
        description: 'Publish the application with reported-duration laboratory explicitly marked experimental'
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: pages-production
  cancel-in-progress: false
jobs:
  deploy:
    # Only trusted main pushes can enter the secret-bearing automatic job; PR CI cannot.
    if: vars.ASU_HOSTED_JOBS_ENABLED == 'true' && github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && inputs.confirm_experimental) || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CODE_REVISION: ${{ github.event.workflow_run.head_sha || github.sha }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      VITE_NEON_AUTH_URL: ${{ vars.VITE_NEON_AUTH_URL }}
      VITE_NEON_DATA_API_URL: ${{ vars.VITE_NEON_DATA_API_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Require provisioned deployment credentials
        run: test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck && npm test
      - name: Package the checked application
        run: npm run build
      - name: Stamp the release
        run: node scripts/stamp-release.mjs
      - name: Refuse a superseded production revision
        run: |
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse FETCH_HEAD)" = "$CODE_REVISION"
      - name: Publish to a previously created Free Pages project
        env:
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: npx --yes wrangler@4.151.3 pages deploy dist --project-name "${CLOUDFLARE_PAGES_PROJECT:-asu}" --branch main
      - name: Verify the assigned public URL
        env:
          ASU_PUBLIC_URL: ${{ vars.ASU_PUBLIC_URL }}
        run: |
          for _ in {1..12}; do
            if python3 scripts/smoke_deployment.py; then exit 0; fi
            sleep 5
          done
          exit 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: published-static-${{ github.event.workflow_run.head_sha || github.sha }}
          path: dist/
          retention-days: 7
